# Full local dev stack: Postgres, Adminer, FastAPI (--reload), Vite (HMR).
# Copy .env.example to .env, then: docker compose up
#
# App URLs (defaults): frontend http://localhost:5173  API http://localhost:8000
# (Vite still listens on 8080 inside the container; host port is FRONTEND_PORT.)
# Adminer: http://localhost:5050  (server: postgres, user/db from .env)
#
# Reset cached frontend node_modules in Docker: docker compose down && docker volume rm amity_frontend_node_modules

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      POSTGRES_DB: ${POSTGRES_DB:-campus_merch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-5050}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  api:
    image: amity-api:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-campus}:${POSTGRES_PASSWORD:-campus}@postgres:5432/${POSTGRES_DB:-campus_merch}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      ACCESS_TOKEN_EXPIRE_DAYS: ${ACCESS_TOKEN_EXPIRE_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PRODUCT_SEED_ON_EMPTY: ${PRODUCT_SEED_ON_EMPTY:-true}
      PRODUCT_SEED_FORCE: ${PRODUCT_SEED_FORCE:-false}
    volumes:
      - ./backend:/srv
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: amity-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    environment:
      # Browser calls this URL; must be reachable from the host, not the Docker service name.
      # Host `docker compose` loads repo `.env` for ${VITE_API_URL} if set.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
